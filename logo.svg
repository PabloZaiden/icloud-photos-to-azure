<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 216" role="img" aria-labelledby="title desc">
  <title id="title">Photos Backup icon</title>
  <desc id="desc">A colorful camera aperture surrounding a cloud upload arrow.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16264f"/>
      <stop offset="1" stop-color="#0759bd"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55d8ff"/>
      <stop offset="1" stop-color="#2577f5"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16305b" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#tile-shadow)">
    <rect x="20" y="20" width="176" height="176" rx="42" fill="url(#tile)"/>
    <rect x="21" y="21" width="174" height="174" rx="41" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="2"/>
  </g>

  <g transform="translate(108 108) scale(.66)">
    <path d="M-11-77C-3-99 17-110 39-105L69-87C76-65 66-45 45-36L12-43C3-53-7-64-11-77Z" fill="#ff7285"/>
    <path d="M-11-77C-3-99 17-110 39-105L69-87C76-65 66-45 45-36L12-43C3-53-7-64-11-77Z" fill="#ffb547" transform="rotate(60)"/>
    <path d="M-11-77C-3-99 17-110 39-105L69-87C76-65 66-45 45-36L12-43C3-53-7-64-11-77Z" fill="#64d99a" transform="rotate(120)"/>
    <path d="M-11-77C-3-99 17-110 39-105L69-87C76-65 66-45 45-36L12-43C3-53-7-64-11-77Z" fill="#45c5e8" transform="rotate(180)"/>
    <path d="M-11-77C-3-99 17-110 39-105L69-87C76-65 66-45 45-36L12-43C3-53-7-64-11-77Z" fill="#6e8cff" transform="rotate(240)"/>
    <path d="M-11-77C-3-99 17-110 39-105L69-87C76-65 66-45 45-36L12-43C3-53-7-64-11-77Z" fill="#b38bff" transform="rotate(300)"/>
    <circle r="35" fill="#f8fbff"/>
    <path d="M-21 12a12 12 0 0 1 1-24 18 18 0 0 1 34-5 12 12 0 0 1 8 22h-43Z" fill="url(#cloud)"/>
    <path d="M0 17V-4m-9 9L0-4 9 5" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.5"/>
  </g>

